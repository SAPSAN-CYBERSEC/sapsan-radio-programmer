name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Typy i testy osobno, zeby z logu bylo od razu widac, co poszlo nie tak.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
