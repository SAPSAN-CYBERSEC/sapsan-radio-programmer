<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio programmer</title>
    <meta
      name="description"
      content="Set up channels in your Baofeng handheld straight from the browser. Nothing to install."
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="head-row">
        <div>
          <h1 id="t-title"></h1>
          <p class="subtitle" id="t-subtitle"></p>
        </div>
        <div class="pickers">
          <label>
            <span id="t-language"></span>
            <select id="lang"></select>
          </label>
          <label>
            <span id="t-country"></span>
            <select id="country"></select>
          </label>
          <label id="place-wrap" hidden>
            <span id="t-place"></span>
            <select id="place"></select>
          </label>
        </div>
      </div>
      <p class="legal-banner" id="t-legal"></p>
    </header>

    <main id="app">
      <section class="step" id="step-connect">
        <h2><span class="num">1</span> <span id="t-step1"></span></h2>
        <ol class="checklist">
          <li id="t-hint1"></li>
          <li id="t-hint2"></li>
          <li id="t-hint3"></li>
        </ol>
        <label class="model-pick">
          <span id="t-model"></span>
          <select id="model"></select>
        </label>
        <button class="big" id="btn-connect"></button>
        <p class="note" id="browser-warning" hidden></p>
      </section>

      <section class="step" id="step-choose" hidden>
        <h2><span class="num">2</span> <span id="t-step2"></span></h2>
        <p class="lead" id="t-choose-lead"></p>
        <div id="sets" class="sets"></div>
        <p class="counter" id="counter"></p>
        <button class="big" id="btn-next"></button>
      </section>

      <section class="step" id="step-write" hidden>
        <h2><span class="num">3</span> <span id="t-step3"></span></h2>
        <p class="lead" id="t-backup-lead"></p>
        <button class="big" id="btn-backup"></button>
        <p class="ok" id="backup-status" hidden></p>

        <button class="big danger" id="btn-write" disabled></button>
        <p class="warn" id="t-dont-unplug"></p>

        <div class="progress" id="progress" hidden><div class="bar" id="bar"></div></div>
      </section>

      <!-- Widoczne po polaczeniu, niezaleznie od tego, na ktorym kroku jest uzytkownik:
           kto siega po kopie zapasowa, zwykle ma juz klopot i nie chce przechodzic kreatora. -->
      <section class="step restore" id="restore" hidden>
        <h2 id="t-restore-title"></h2>
        <p class="lead" id="t-restore-lead"></p>
        <input type="file" id="restore-file" accept=".img,application/octet-stream" />
        <button class="big" id="btn-restore" disabled></button>
        <p class="ok" id="restore-status" hidden></p>
      </section>

      <section class="step done" id="step-done" hidden>
        <h2 id="t-done-title"></h2>
        <p class="lead" id="done-text"></p>
        <button class="big" id="btn-restart"></button>
      </section>

      <p class="error" id="error" hidden></p>
    </main>

    <footer class="footer">
      <p id="t-footer">Everything runs in your browser. Nothing is sent anywhere.</p>
    </footer>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
